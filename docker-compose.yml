services:
  mssql:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: test-mssql
    restart: always
    environment:
      ACCEPT_EULA: "Y"
      SA_PASSWORD: ${DB_PASSWORD:-StrongPassword123!}
    ports:
      - "${DB_PORT:-1434}:1433"
    volumes:
      - mssql_data:/var/opt/mssql
      - ./backup:/var/opt/mssql/backup
    healthcheck:
      # -C acepta el certificado autofirmado de la imagen; sin él sqlcmd 18 se
      # niega a conectar y el healthcheck nunca pasaría a healthy.
      test:
        [
          "CMD-SHELL",
          "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$SA_PASSWORD\" -C -b -Q 'SELECT 1' || exit 1",
        ]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s

  # Esta imagen es la única de las cinco sin initdb.d, así que el esquema y el
  # seed los aplica este contenedor auxiliar: espera a que el servidor esté
  # sano, ejecuta los .sql si aún no están y termina. Levantarlo arrastra al
  # propio SQL Server, así que basta con `docker compose up -d mssql-init`.
  mssql-init:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: test-mssql-init
    restart: "no"
    depends_on:
      mssql:
        condition: service_healthy
    environment:
      SA_PASSWORD: ${DB_PASSWORD:-StrongPassword123!}
      DB_HOST: mssql
    volumes:
      - ./docker/sqlserver/sql:/sql:ro
      - ./docker/sqlserver/init:/init:ro
    entrypoint: ["/bin/bash", "/init/00_init.sh"]

  oracle:
    # Imagen community de Gerald Venzl: Oracle Database 23ai Free, sin login en
    # container-registry.oracle.com. La variante "faststart" trae la base ya
    # creada, así que el primer arranque baja de ~10 min a ~1 min.
    image: gvenzl/oracle-free:23-slim-faststart
    container_name: test-oracle
    restart: unless-stopped
    environment:
      # Password de SYS / SYSTEM.
      ORACLE_PASSWORD: ${ORACLE_SYS_PASSWORD:-OraclePassword1}
      # La imagen crea este usuario dentro del PDB FREEPDB1 y le da CONNECT +
      # RESOURCE. Es el que usa la API; nunca conectamos como SYS.
      APP_USER: ${ORACLE_USER:-appuser}
      APP_USER_PASSWORD: ${ORACLE_PASSWORD:-AppPassword1}
    ports:
      - "${ORACLE_PORT:-1521}:1521"
    volumes:
      - oracle_data:/opt/oracle/oradata
      # Sólo el .sh vive en initdb.d: es el que decide con qué usuario y contra
      # qué PDB se aplican los .sql (ver docker/oracle/init/00_init.sh).
      - ./docker/oracle/init:/container-entrypoint-initdb.d
      - ./docker/oracle/sql:/opt/appsql
    healthcheck:
      test: ["CMD", "healthcheck.sh"]
      interval: 10s
      timeout: 10s
      retries: 30
      start_period: 60s

  postgres:
    image: postgres:16-alpine
    container_name: test-postgres
    restart: unless-stopped
    environment:
      # La imagen crea este usuario y esta base al inicializar el volumen; es la
      # cuenta que usa la API, no hay superusuario aparte que administrar.
      POSTGRES_USER: ${POSTGRES_USER:-appuser}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-AppPassword1}
      POSTGRES_DB: ${POSTGRES_DB:-testdb}
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # A diferencia de Oracle, esta imagen sí garantiza con qué usuario y contra
      # qué base corre los .sql de initdb.d (POSTGRES_USER / POSTGRES_DB) y los
      # aplica en orden alfabético, así que no hace falta script intermedio.
      - ./docker/postgres/sql:/docker-entrypoint-initdb.d
    healthcheck:
      # pg_isready sólo responde por TCP cuando termina la inicialización: durante
      # los scripts de initdb el servidor temporal escucha sólo por socket Unix.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U ${POSTGRES_USER:-appuser} -d ${POSTGRES_DB:-testdb}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  mysql:
    image: mysql:8
    container_name: test-mysql
    restart: unless-stopped
    environment:
      # Root sólo existe para que la imagen pueda arrancar y aplicar el esquema;
      # la API entra siempre con MYSQL_USER.
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-RootPassword1}
      MYSQL_USER: ${MYSQL_USER:-appuser}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-AppPassword1}
      MYSQL_DATABASE: ${MYSQL_DB:-testdb}
    ports:
      # 3306 suele estar tomado por una instalación local de MySQL/MariaDB, así
      # que fuera se publica en 3307 salvo que se pida otra cosa.
      - "${MYSQL_PORT:-3307}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      # La imagen ejecuta sola los .sql de initdb.d, en orden y ya conectada a
      # MYSQL_DATABASE, de modo que los scripts no necesitan un USE previo.
      - ./docker/mysql/sql:/docker-entrypoint-initdb.d
    healthcheck:
      # Se fuerza TCP contra 127.0.0.1 en lugar del socket: el servidor temporal
      # que aplica initdb.d arranca con --skip-networking, así que responder por
      # el puerto es justo la señal de que el esquema ya está aplicado.
      test:
        [
          "CMD-SHELL",
          "mysqladmin ping -h 127.0.0.1 -u root -p\"$$MYSQL_ROOT_PASSWORD\" --silent",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  mongo:
    image: mongo:7
    container_name: test-mongo
    restart: unless-stopped
    # Réplica de un solo nodo, no mongod suelto: el repositorio genérico escribe
    # la operación y su línea de AUDIT_LOG dentro de una transacción, y las
    # transacciones multi-documento sólo existen sobre un replica set. Un mongod
    # sin oplog rechaza startTransaction, así que sin esto la API no arranca.
    command: ["mongod", "--replSet", "rs0", "--bind_ip_all"]
    environment:
      # Base contra la que la imagen ejecuta los scripts de initdb.d.
      MONGO_INITDB_DATABASE: ${MONGO_DB:-testdb}
      # MONGO_INITDB_ROOT_USERNAME/PASSWORD se dejan sin poner a propósito: al
      # definirlas, el entrypoint quita --replSet del servidor temporal de initdb
      # y además exigiría un keyFile de autenticación interna para el replica set.
    ports:
      - "${MONGO_PORT:-27017}:27017"
    volumes:
      - mongo_data:/data/db
      # El rs.initiate() vive dentro de 01-init.js y no en un script aparte porque
      # el mongod temporal de initdb también arranca con --replSet: hasta que la
      # réplica no está iniciada el nodo no es primario y el propio seed fallaría.
      - ./docker/mongo/init:/docker-entrypoint-initdb.d
    healthcheck:
      # rs.status() lanza excepción mientras la réplica no esté iniciada, así que
      # "healthy" significa aquí "réplica lista", no sólo "puerto abierto".
      test: ["CMD-SHELL", "mongosh --quiet --eval 'quit(rs.status().ok === 1 ? 0 : 1)'"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  minio:
    image: minio/minio:latest
    container_name: minio
    # Sin `command` la imagen no arranca nada: su entrypoint es el binario
    # `minio`, y ejecutarlo sin subcomando imprime la ayuda y termina con
    # código 0. El contenedor aparecía como "Exited (0)" y parecía que se
    # apagaba solo, cuando en realidad nunca llegó a levantar el servidor.
    command: server /data --console-address ":9001"
    ports:
      - "9100:9000"   # API disponible en http://localhost:9100
      - "9101:9001"   # WebUI disponible en http://localhost:9101
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - ./s3_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  # Crea el bucket que la aplicación espera. MinIO arranca sin ninguno y el
  # cliente de S3 no lo crea al vuelo, así que sin esto la primera subida
  # fallaría con NoSuchBucket aun estando todo levantado. Termina y se va, igual
  # que mssql-init.
  minio-init:
    image: minio/mc:latest
    container_name: minio-init
    restart: "no"
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 minioadmin minioadmin &&
      mc mb --ignore-existing local/my-bucket &&
      mc anonymous set download local/my-bucket &&
      echo 'Bucket my-bucket listo'
      "




volumes:
  mssql_data:
  oracle_data:
  postgres_data:
  mysql_data:
  mongo_data:

